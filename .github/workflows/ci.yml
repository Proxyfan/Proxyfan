name: ci

# Post-merge gate for `main`. Runs the full build AND the test suite so that
# regressions introduced by a merged pull request are caught before they ride
# into the next release. Pull-request validation (build only) lives in
# `pr.yml` to keep PR feedback fast and the gate cost asymmetric: tests pay
# their full cost once per merge instead of on every PR push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        shell: pwsh
        run: ./.tools/Invoke-Build.ps1 -Configuration Debug

      - name: Test
        shell: pwsh
        run: ./.tools/Run-Tests.ps1 -Configuration Debug -NoBuild
